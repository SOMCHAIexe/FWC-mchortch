<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piscine Web Table</title>
    <style>
        /* General Page Styling */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        /* 100% Width Table Style */
        table {
            width: 100%;
            height: 100vh;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            text-align: center;
            vertical-align: top;
            padding-top: 20px;
            font-size: 36px;
            border: 4px solid black;
        }

        .left-cell {
            background-color: yellow;
            color: black;
        }

        .right-cell {
            background-color: cyan;
            color: black;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="left-cell">CellA</td>
            <td class="right-cell">CellB</td>
        </tr>
    </table>

</body>
</html>
