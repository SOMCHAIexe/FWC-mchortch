<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <!-- Invisible Table Container -->
    <table>
        <!-- 1. Header on top -->
        <tr>
            <th><h2>User Profile Card</h2></th>
        </tr>

        <!-- 2. Profile Picture -->
        <tr>
            <td style="padding: 0;">
                <img src="Heart.jpg" alt="Profile Picture" class="profile-pic">
            </td>
        </tr>

        <!-- 3. Login -->
        <tr>
            <td><strong>mchortch</strong></td>
        </tr>

        <!-- 4. 2-3 Words Description -->
        <tr>
            <td>Really Fun With Coding</td>
        </tr>

        <!-- 5. Social Network Images -->
        <tr>
            <td>
                <a href="https://www.facebook.com/?locale=th_TH">
                <img src="https://z-m-static.xx.fbcdn.net/rsrc.php/yt/r/DUiOg0mJTjz.webp" alt="Social 1" class="social-icon">
                </a>
                <a href="https://www.instagram.com/?hl=en">
                <img src="https://www.knmasters.com/wp-content/uploads/2025/03/Instagram_logo_2022.svg" alt="Social 2" class="social-icon">
                </a>
                <a href="https://www.line.me/en/">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbEShq5d8ArPmriW-HvvJlVeifX-U-ENp1NYkFvGFKHQ&s=10" alt="Social 3" class="social-icon">
                </a>
            </td>
        </tr>

        <!-- 6. Contact Button -->
        <tr>
            <td style="padding: 0; background-color: black;">
                <button type="button">Contact</button>
            </td>
        </tr>
    </table>

</body>
</html>
